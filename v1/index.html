<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 32 32&apos;%3E%3Crect width=&apos;32&apos; height=&apos;32&apos; fill=&apos;%23F6F2EA&apos;/%3E%3Ccircle cx=&apos;16&apos; cy=&apos;16&apos; r=&apos;6&apos; fill=&apos;%23A9743F&apos;/%3E%3C/svg%3E">
<title>Прототип сайта Мебель 20</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F6F2EA; --paper-2:#EFE9DE; --ink:#221B16; --ink-soft:#4A3F37;
  --muted:#736657; --line:#DCD3C4; --wood:#A9743F; --wine:#7E3B3B;
  --shadow:rgba(34,27,22,.10);
  --f-display:'Lora',Georgia,'Times New Roman',serif;
  --f-text:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);
  font:400 16px/1.65 var(--f-text);-webkit-font-smoothing:antialiased;
  background:var(--paper);
  background-image:radial-gradient(85% 50% at 92% 2%,rgba(169,116,63,.055) 0%,transparent 60%),
    radial-gradient(65% 45% at 2% 46%,rgba(126,59,59,.035) 0%,transparent 58%);
  background-attachment:fixed}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:0 clamp(22px,3vw,52px)}

/* ——— панель прототипа ——— */
.bar{position:sticky;top:0;z-index:50;background:var(--paper);
  border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:18px;padding:10px 28px;flex-wrap:wrap}
.bar b{font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{font:500 13px/1 var(--f-text);padding:9px 15px;border:1px solid transparent;
  background:none;color:var(--muted);cursor:pointer;border-radius:2px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--line);background:var(--paper-2)}
.tab:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
.toggle{font:400 12px/1 var(--f-text);color:var(--muted);display:flex;
  align-items:center;gap:7px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--wood);width:15px;height:15px;margin:0}

/* ——— подписи структуры ——— */
.note{position:relative}
.note::before{display:none}
body.show-notes .note::before{display:block}
.note::before{content:attr(data-note);position:absolute;top:-1px;left:0;
  transform:translateY(-100%);
  font:500 10px/1.4 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--wine);background:var(--paper);padding:3px 8px;
  border:1px dashed var(--wine);white-space:nowrap;z-index:5}
body.show-notes section{outline:1px dashed color-mix(in srgb,var(--wine) 35%,transparent);
  outline-offset:6px}

/* ——— шапка сайта ——— */
.top{border-bottom:1px solid var(--line);background:var(--paper)}
.top-in{display:flex;align-items:center;gap:34px;padding:17px 0}
.logo{font:500 25px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.logo span{display:block;font:400 10px/1.5 var(--f-text);
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.nav{display:flex;gap:24px;font:400 13px/1 var(--f-text);
  letter-spacing:.06em;text-transform:uppercase;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink-soft);padding-bottom:3px;
  border-bottom:1px solid transparent}
.nav a:hover,.nav a.on{color:var(--ink);border-color:var(--wood)}
.top-contact{margin-left:auto;text-align:right;font:400 13px/1.55 var(--f-text)}
.top-contact b{display:block;font:500 15px/1.3 var(--f-display);letter-spacing:.01em}
.top-contact span{color:var(--muted);font-size:12px}

/* ——— первый экран ——— */
.hero{display:grid;grid-template-columns:1.05fr .95fr;
  min-height:clamp(520px,68vh,780px);border-bottom:1px solid var(--line)}
.hero-img{position:relative;overflow:hidden;background:var(--paper-2)}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:50% 44%}
.hero-img::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(246,242,234,0) 78%,rgba(246,242,234,.34) 100%)}
.hero-txt{display:flex;flex-direction:column;justify-content:center;
  padding:clamp(44px,5vw,78px) clamp(28px,4.5vw,74px);gap:22px}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--wood)}
h1{font:400 clamp(34px,3.4vw,66px)/1.12 var(--f-display);margin:0;
  text-wrap:balance;letter-spacing:-.015em}
h1 em{font-style:italic;color:var(--wood)}
.lede{font:300 clamp(16px,1.05vw,20px)/1.65 var(--f-text);color:var(--ink-soft);max-width:50ch;margin:0}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-block;font:500 13px/1 var(--f-text);letter-spacing:.05em;
  text-transform:uppercase;padding:15px 26px;text-decoration:none;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  transition:background .18s,color .18s}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}

/* ——— общие секции ——— */
section{padding:clamp(64px,6.2vw,112px) 0}
.sec-head{display:flex;align-items:flex-end;gap:26px;margin-bottom:clamp(30px,3.2vw,46px);flex-wrap:wrap}
.sec-head h2{font:400 clamp(25px,2.4vw,46px)/1.18 var(--f-display);margin:0;
  letter-spacing:-.01em;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted);font-size:clamp(15px,.95vw,17px);max-width:56ch}
.sec-head .more{margin-left:auto;font:500 12px/1 var(--f-text);letter-spacing:.08em;
  text-transform:uppercase;color:var(--wood);text-decoration:none;
  border-bottom:1px solid currentColor;padding-bottom:3px;white-space:nowrap}

/* ——— эскиз → изделие ——— */
.craft{background:linear-gradient(177deg,#F1EBE0 0%,#EEE8DC 54%,#EAE3D5 100%);
  position:relative}
.craft::before,.craft::after{content:"";position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line) 13%,var(--line) 87%,transparent)}
.craft::before{top:0}.craft::after{bottom:0}
.pairs{display:grid;gap:clamp(40px,4vw,64px)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;
  background:var(--paper);border:1px solid var(--line)}
.pair figure{margin:0;position:relative;min-height:270px;overflow:hidden}
.pair img{width:100%;height:100%;object-fit:cover}
.pair figcaption{position:absolute;left:0;bottom:0;
  font:500 10px/1 var(--f-mono);letter-spacing:.13em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);padding:7px 11px}
.pair .said{padding:34px 36px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.pair h3{font:400 clamp(22px,1.5vw,30px)/1.28 var(--f-display);margin:0}
.pair p{margin:0;color:var(--ink-soft);font-size:clamp(15px,.95vw,17px);line-height:1.62}
.pair dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:8px 0 0;
  font-size:13px}
.pair dt{color:var(--muted);font:400 12px/1.6 var(--f-mono);letter-spacing:.04em}
.pair dd{margin:0;color:var(--ink-soft)}

/* ——— проекты ——— */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chip{font:500 12px/1 var(--f-text);letter-spacing:.05em;padding:10px 16px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  cursor:pointer;border-radius:100px;transition:.16s}
.chip:hover{color:var(--ink);border-color:var(--wood)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip:focus-visible{outline:2px solid var(--wood);outline-offset:2px}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,1.8vw,30px)}
@media (max-width:1100px){.projects{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.projects{grid-template-columns:1fr}}
.proj{display:flex;flex-direction:column;background:var(--paper);
  border:1px solid var(--line);text-decoration:none;transition:.2s;overflow:hidden}
.proj:hover{border-color:var(--wood);transform:translateY(-2px);
  box-shadow:0 10px 26px var(--shadow)}
.proj .ph{aspect-ratio:4/3;overflow:hidden;background:var(--paper-2)}
.proj .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.proj:hover .ph img{transform:scale(1.03)}
.proj .body{padding:20px 21px 22px;display:flex;flex-direction:column;gap:9px;flex:1}
.proj .meta{display:flex;gap:12px;align-items:baseline;
  font:400 11px/1 var(--f-mono);letter-spacing:.08em;color:var(--muted);
  text-transform:uppercase}
.proj .meta .sq{color:var(--wood);font-weight:500}
.proj h3{font:400 clamp(20px,1.35vw,26px)/1.3 var(--f-display);margin:0}
.proj .who{font-size:13px;color:var(--muted)}
.proj .items{margin-top:auto;padding-top:13px;border-top:1px solid var(--line);
  display:flex;gap:7px;flex-wrap:wrap}
.proj .items span{font:400 11px/1 var(--f-text);letter-spacing:.03em;
  color:var(--ink-soft);background:var(--paper-2);padding:6px 9px;border-radius:2px}

/* ——— материалы ——— */
.mats{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
  background:var(--line);border:1px solid var(--line)}
@media (max-width:1200px){.mats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.mats{grid-template-columns:1fr}}
.mat{background:var(--paper);padding:0;position:relative;overflow:hidden}
.mat img{aspect-ratio:5/4;object-fit:cover;width:100%}
.mat .cap{padding:17px 19px 20px}
.mat h4{font:500 15px/1.3 var(--f-text);margin:0 0 5px}
.mat p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}

.people .invite{margin:20px 0 0;padding:16px 18px;background:var(--paper-2);
  border-left:2px solid var(--wood);font-size:14.5px;line-height:1.6;color:var(--ink-soft)}
.people .invite b{font-weight:500;color:var(--ink);white-space:nowrap}

.no-hits{margin:26px 0 0;color:var(--muted);font-size:15px;display:none}
[data-stage] img{-webkit-user-drag:none;user-select:none}

/* ——— материалы: крупные пары фото + текст ——— */
.rows{display:grid;gap:clamp(30px,3.4vw,64px)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,3vw,60px);align-items:center}
.row.rev figure{order:2}
.row figure{margin:0;overflow:hidden;background:var(--paper-2);border:1px solid var(--line)}
.row figure img{width:100%;aspect-ratio:4/3;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.row figure:hover img{transform:scale(1.04)}
.row h3{font:400 clamp(21px,2vw,34px)/1.2 var(--f-display);margin:12px 0 14px;
  letter-spacing:-.015em}
.row p{margin:0;color:var(--ink-soft);font-size:clamp(15px,.95vw,17px);line-height:1.65;max-width:52ch}
.chipset{display:flex;flex-wrap:wrap;gap:7px;margin:20px 0 0;padding:0;list-style:none}
.chipset li{font:400 12.5px/1 var(--f-mono);padding:8px 12px;border:1px solid var(--line);
  color:var(--muted);background:var(--paper)}
@media (max-width:900px){
  .row{grid-template-columns:1fr}
  .row.rev figure{order:0}
}

/* ——— типы изделий и этапы работы ——— */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:1px;background:transparent;border:0}
.type{outline:1px solid var(--line)}
.type{background:var(--paper);padding:clamp(20px,2vw,28px);display:grid;
  grid-template-columns:auto 1fr;gap:16px;align-items:baseline}
.type .n{font:500 11px/1 var(--f-mono);color:var(--wood);letter-spacing:.08em}
.type h3{font:400 clamp(18px,1.5vw,23px)/1.28 var(--f-display);margin:0 0 9px}
.type p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}

.order{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2vw,34px)}
.ostep{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;
  padding:clamp(18px,1.8vw,24px) 0;border-top:1px solid var(--line)}
.ostep .n{font:500 11px/1 var(--f-mono);color:var(--wood);letter-spacing:.08em}
.ostep h3{font:400 clamp(18px,1.5vw,23px)/1.28 var(--f-display);margin:0 0 9px}
.ostep p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.62;max-width:52ch}
@media (max-width:900px){.order{grid-template-columns:1fr}}

/* ——— палитра пород: образец выводится не крупнее оригинала, поэтому резкий ——— */
.veneer{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(7px,.7vw,12px);margin:22px 0 0}
.veneer figure{margin:0}
.veneer .sw-img{display:block;aspect-ratio:4/5;overflow:hidden;background:var(--paper-2);
  border:1px solid var(--line)}
.veneer img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.25,1)}
.veneer figure:hover img{transform:scale(1.06)}
.veneer figcaption{margin-top:8px;font:400 12.5px/1.3 var(--f-text);color:var(--muted)}
@media (max-width:900px){.veneer{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.veneer{grid-template-columns:repeat(2,1fr)}}

/* ——— кадры производства вместо одного коллажа ——— */
.people .shots{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);
  align-self:stretch}
.people .shots figure{margin:0;position:relative;overflow:hidden;background:var(--paper-2);
  min-height:0}
.people .shots img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.people .shots figure:hover img{transform:scale(1.05)}
.people .shots figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 13px 10px;
  font:400 11px/1.35 var(--f-mono);letter-spacing:.03em;color:#F2EBDF;
  background:linear-gradient(0deg,rgba(24,18,13,.86),transparent)}
@media (max-width:560px){.people .shots figcaption{font-size:10px;padding:10px 10px 8px}}

/* ——— мастера ——— */
.people{display:grid;grid-template-columns:1fr 1fr;gap:0;
  border:1px solid var(--line);background:var(--paper)}
.people figure{margin:0;min-height:340px;overflow:hidden}
.people img{width:100%;height:100%;object-fit:cover;object-position:50% 40%}
.people .txt{padding:52px 48px;display:flex;flex-direction:column;
  justify-content:center;gap:16px}
.people h2{font:400 clamp(24px,2.6vw,32px)/1.22 var(--f-display);margin:0}
.people p{margin:0;color:var(--ink-soft);font-size:15.5px;line-height:1.68}
.stats{display:grid;gap:11px;margin-top:14px;max-width:440px}
.stats .line{display:flex;align-items:baseline;gap:10px;font-size:14.5px}
.stats .line span{flex:none;color:var(--ink-soft)}
.stats .line i{flex:1;height:1px;transform:translateY(-3px);opacity:.55;
  background:radial-gradient(circle,var(--muted) .9px,transparent .9px) repeat-x;
  background-size:5px 1px}
.stats .line b{flex:none;font:400 19px/1.25 var(--f-display);color:var(--wood);
  text-align:right;max-width:52%}
.stat b{display:block;font:400 30px/1 var(--f-display);color:var(--wood)}
.stat span{font:400 12px/1.4 var(--f-mono);letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted)}

/* ——— форма ——— */
.ask{background:var(--ink);color:var(--paper);border-radius:0}
.ask .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,56px);align-items:center}
.ask .wrap>*{min-width:0}
.ask h2{font:400 clamp(25px,2.9vw,34px)/1.24 var(--f-display);margin:0 0 14px;color:var(--paper)}
.ask p{margin:0;color:#C9BCAA;font-size:15.5px;line-height:1.66}
.steps{display:grid;gap:11px;margin-top:22px;counter-reset:s}
.steps li{list-style:none;counter-increment:s;display:flex;gap:13px;
  align-items:baseline;font-size:14.5px;color:#C9BCAA}
.steps li::before{content:counter(s,decimal-leading-zero);
  font:500 11px/1 var(--f-mono);color:var(--wood);letter-spacing:.06em}
.form{background:linear-gradient(168deg,rgba(255,255,255,.075),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.12);padding:clamp(24px,2.6vw,40px)}
.form .row{display:grid;gap:9px;margin-bottom:clamp(16px,1.6vw,22px);position:relative}
.form label{font:400 10.5px/1 var(--f-mono);letter-spacing:.14em;
  text-transform:uppercase;color:#9A8B78}
.form input{font:400 16px/1.4 var(--f-text);padding:15px 16px;width:100%;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.14);
  color:var(--paper);border-radius:0;transition:border-color .18s,background .18s}
.form input::placeholder{color:#7C6E5E}
.form input:hover{border-color:rgba(255,255,255,.28)}
.form input:focus{outline:none;border-color:var(--wood);background:rgba(0,0,0,.36)}

/* ——— свой выпадающий список: системный в тёмной форме выглядит инородно ——— */
.sel{position:relative}
.sel>select{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.sel-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;padding:15px 16px;font:400 16px/1.4 var(--f-text);text-align:left;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.14);
  color:var(--paper);cursor:pointer;transition:border-color .18s,background .18s}
.sel-btn:hover{border-color:rgba(255,255,255,.28)}
.sel-btn::after{content:"";flex:none;width:8px;height:8px;margin-right:2px;
  border-right:1.5px solid var(--wood);border-bottom:1.5px solid var(--wood);
  transform:translateY(-3px) rotate(45deg);transition:transform .22s}
.sel.open .sel-btn{border-color:var(--wood);background:rgba(0,0,0,.36)}
.sel.open .sel-btn::after{transform:translateY(1px) rotate(225deg)}
.sel-list{position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;
  background:#241C16;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;display:none;
  max-height:280px;overflow:auto}
.sel.open .sel-list{display:block;animation:selin .18s ease both}
@keyframes selin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sel-list button{display:block;width:100%;text-align:left;padding:12px 14px;
  font:400 15px/1.35 var(--f-text);color:#D9CDBC;background:none;border:0;cursor:pointer;
  transition:background .14s,color .14s}
.sel-list button:hover{background:rgba(169,116,63,.16);color:var(--paper)}
.sel-list button[aria-selected="true"]{color:var(--wood)}
.sel-list button[aria-selected="true"]::before{content:"— ";color:var(--wood)}

.form .btn{width:100%;text-align:center;background:var(--wood);
  border-color:var(--wood);color:#17110C;margin-top:8px;padding:17px 26px;font-size:14px}
.form .btn:hover{background:transparent;color:var(--wood)}
.form .hint{font-size:12.5px;color:#9A8B78;margin:13px 0 0;line-height:1.55}

/* ——— подвал ——— */
.foot{border-top:1px solid var(--line);background:var(--paper-2);padding:52px 0 34px}
.foot-in{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:36px}
.foot h5{font:500 11px/1 var(--f-mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin:0 0 15px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14px}
.foot a{text-decoration:none;color:var(--ink-soft)}
.foot a:hover{color:var(--wood)}
.foot .brand{font:500 21px/1 var(--f-display)}
.foot .brand span{display:block;font:400 12px/1.6 var(--f-text);color:var(--muted);margin-top:7px}
.foot-bottom{border-top:1px solid var(--line);margin-top:34px;padding-top:19px;
  display:flex;gap:18px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

/* ——— страница раздела ——— */
.crumbs{font:400 12px/1 var(--f-text);color:var(--muted);padding:20px 0;
  border-bottom:1px solid var(--line)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--wood)}
.intro{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:start}
.intro h1{font-size:clamp(29px,3.4vw,42px)}
.intro .side{border-left:2px solid var(--wood);padding-left:22px}
.intro .side p{margin:0 0 13px;font-size:14.5px;color:var(--ink-soft);line-height:1.62}
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);margin-top:8px}
@media (max-width:1000px){.feats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.feats{grid-template-columns:1fr}}
.feat{background:var(--paper);padding:26px 25px 28px}
.feat .n{font:500 11px/1 var(--f-mono);color:var(--wood);letter-spacing:.08em}
.feat h3{font:500 16px/1.4 var(--f-text);margin:11px 0 7px}
.feat p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.gal figure{margin:0;border:1px solid var(--line);background:var(--paper)}
.gal img{aspect-ratio:1/1;object-fit:cover;width:100%}
.gal figcaption{padding:13px 15px 15px;font-size:13.5px;line-height:1.45}
.gal .obj{display:block;font:400 11px/1 var(--f-mono);color:var(--wood);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}


/* ——— движение ——— */
@keyframes kenburns{from{transform:scale(1) translate3d(0,0,0)}
  to{transform:scale(1.08) translate3d(-1.2%,-1.5%,0)}}
.hero-img img{will-change:transform;transition:transform .18s linear}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.anim .hero-txt>*{animation:rise .8s cubic-bezier(.2,.75,.25,1) both}
body.anim .hero-txt>*:nth-child(1){animation-delay:.05s}
body.anim .hero-txt>*:nth-child(2){animation-delay:.14s}
body.anim .hero-txt>*:nth-child(3){animation-delay:.24s}
body.anim .hero-txt>*:nth-child(4){animation-delay:.34s}

body.anim .rv{opacity:0;transform:translateY(20px);
  transition:opacity .7s cubic-bezier(.2,.75,.25,1),transform .7s cubic-bezier(.2,.75,.25,1)}
body.anim .rv.in{opacity:1;transform:none}

.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:var(--wood);
  transform:translateY(101%);transition:transform .28s cubic-bezier(.3,.7,.2,1);z-index:-1}
.btn:hover::after{transform:translateY(0)}
.btn.ghost:hover{background:var(--ink)}

.more{position:relative}
.more::after{content:" →";transition:padding .2s}
.more:hover::after{padding-left:5px}

.mat img{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.mat:hover img{transform:scale(1.05)}
.mat .cap{position:relative;z-index:1;background:var(--paper);transition:transform .3s}
.mat:hover .cap{transform:translateY(-4px)}

.proj{cursor:pointer}
.proj .ph{position:relative}
.proj .ph::after{content:"Смотреть проект";position:absolute;inset:auto 0 0 0;
  font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper);background:linear-gradient(transparent,rgba(20,15,12,.82));
  padding:34px 14px 13px;opacity:0;transform:translateY(8px);transition:.3s}
.proj:hover .ph::after{opacity:1;transform:none}
.proj:hover .ph img{transform:scale(1.06)}

/* ——— шторка эскиз/изделие ——— */
.craft-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.ct{font:500 12px/1 var(--f-text);letter-spacing:.05em;padding:10px 16px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted);
  cursor:pointer;transition:.18s}
.ct:hover{color:var(--ink);border-color:var(--wood)}
.ct.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.slab{display:grid;grid-template-columns:1.25fr .75fr;background:var(--paper);
  border:1px solid var(--line)}
.slab[hidden]{display:none}
.stage{position:relative;overflow:hidden;aspect-ratio:3/2;min-height:340px;background:#EDE6DA;
  cursor:ew-resize;user-select:none;touch-action:none}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st-front{position:absolute;inset:0;width:50%;overflow:hidden;will-change:width}
.st-front img{width:var(--sw,760px);max-width:none}
.st-bar{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--paper);
  transform:translateX(-1px);box-shadow:0 0 0 1px rgba(0,0,0,.25);will-change:left}
.st-knob{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:50%;background:var(--paper);border:1px solid var(--line);
  display:grid;place-items:center;box-shadow:0 4px 16px rgba(20,15,12,.35);
  font:500 13px/1 var(--f-mono);color:var(--ink);will-change:left}
.st-knob::before{content:"‹ ›";letter-spacing:.06em}
.st-lab{position:absolute;top:16px;font:500 10px/1 var(--f-mono);letter-spacing:.13em;
  text-transform:uppercase;padding:7px 11px;background:rgba(20,15,12,.72);
  color:var(--paper);backdrop-filter:blur(3px)}
.st-lab.l{left:16px}.st-lab.r{right:16px}
.slab .said{padding:38px 38px;display:flex;flex-direction:column;justify-content:center;gap:13px}
.slab h3{font:400 23px/1.28 var(--f-display);margin:0}
.slab p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.62}
.slab dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:6px 0 0;font-size:13px}
.slab dt{color:var(--muted);font:400 12px/1.6 var(--f-mono)}
.slab dd{margin:0;color:var(--ink-soft)}
.slab .tip{font:400 12px/1.5 var(--f-mono);color:var(--wood);margin-top:4px}

/* ——— бегущая лента ——— */
.strip{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--paper-2);padding:0}
.strip-in{display:flex;gap:3px;width:max-content;animation:slide 58s linear infinite}
.strip:hover .strip-in{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.strip figure{margin:0;width:clamp(250px,21vw,390px);height:clamp(190px,15.5vw,290px);
  overflow:hidden;position:relative;flex:none}
.strip img{width:100%;height:100%;object-fit:cover;filter:saturate(.92);
  transition:transform .6s,filter .4s}
.strip figure:hover img{transform:scale(1.07);filter:saturate(1.1)}

/* ——— лайтбокс ——— */
.lb{position:fixed;inset:0;z-index:200;background:rgba(18,13,10,.93);
  display:none;place-items:center;padding:38px;cursor:zoom-out}
.lb.on{display:grid;animation:fade .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb img{max-width:min(1100px,92vw);max-height:86vh;object-fit:contain;
  box-shadow:0 24px 70px rgba(0,0,0,.6);animation:pop .38s cubic-bezier(.2,.8,.25,1) both}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.lb .cl{position:absolute;top:22px;right:26px;font:400 30px/1 var(--f-text);
  color:var(--paper);background:none;border:0;cursor:pointer;opacity:.75}
.lb .cl:hover{opacity:1}
.lb .cap{position:absolute;left:0;right:0;bottom:24px;text-align:center;
  font:400 13px/1.5 var(--f-text);color:#C9BCAA}

@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#screen.swap{animation:swap .4s cubic-bezier(.2,.75,.25,1) both}

@media (max-width:900px){
  .hero,.pair,.people,.ask .wrap,.intro,.slab{grid-template-columns:1fr}
  .stage{min-height:300px}
  .slab .said{padding:30px 26px}

<script>
// карта картинок в рантайме не нужна: пути проставлены в разметке
const S = {"home": "<div class=\"top\"><div class=\"wrap\"><div class=\"top-in\">\n  <div class=\"logo\">Мебель 20<span>индивидуальное изготовление</span></div>\n  <nav class=\"nav\">\n    <a href=\"#\" class=\"on\">Главная</a><a href=\"#\">Проекты</a><a href=\"#\">Изготовление</a>\n    <a href=\"#\">Материалы</a><a href=\"#\">Блог</a><a href=\"#\">Контакты</a>\n  </nav>\n  <div class=\"top-contact\"><b>+7 (925) 794-39-10</b><span>Москва, ул. Иркутская, д. 17, стр. 9</span></div>\n</div></div></div>\n<section class=\"hero\" style=\"padding:0\">\n  <div class=\"hero-img\"><img src=\"i/v1-master.webp\" alt=\"Гардеробная из ореха с подсветкой\" fetchpriority=\"high\" width=\"1125\" height=\"1500\"></div>\n  <div class=\"hero-txt note\" data-note=\"Первый экран: кто вы и что делаете\">\n    <div class=\"eyebrow\">Столярное производство · Москва</div>\n    <h1>Мебель, которая начинается<br>с <em>карандаша</em>, а не с каталога</h1>\n    <p class=\"lede\">Работаем по дизайн-проектам и собственным эскизам. Массив, шпон, ручная резьба, авторская отделка. Больше десяти лет в мастерской на Иркутской.</p>\n    <div class=\"cta-row\">\n      <a class=\"btn\" href=\"#\">Прислать проект на просчёт</a>\n      <a class=\"btn ghost\" href=\"#\">Смотреть работы</a>\n    </div>\n  </div>\n</section>\n\n<section class=\"craft note\" data-note=\"От эскиза к изделию — то, чего нет у конкурентов\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div>\n        <h2>От эскиза к изделию</h2>\n        <p>Каждый проект начинается с чертежа от руки: размеры, отделка, фурнитура. Потом согласование выкрасов, потом цех.</p>\n      </div>\n      <a class=\"more\" href=\"#\">Как мы работаем</a>\n    </div>\n    <div class=\"craft-tabs\">\n      <button class=\"ct on\" data-slab=\"0\">Письменный стол</button>\n      <button class=\"ct\" data-slab=\"1\">Комод с кассетными фасадами</button>\n    </div>\n    <div class=\"slab\" data-slab=\"0\">\n      <div class=\"stage\" data-stage>\n        <img src=\"i/v1-stol.webp\" style=\"object-position:38% 46%\" alt=\"Готовый письменный стол\">\n        <div class=\"st-front\"><img src=\"i/v1-sketch1.webp\" style=\"object-position:45% 50%\" alt=\"Эскиз письменного стола\"></div>\n        <div class=\"st-bar\"></div><div class=\"st-knob\"></div>\n        <div class=\"st-lab l\">Эскиз</div><div class=\"st-lab r\">Изделие</div>\n      </div>\n      <div class=\"said\">\n        <h3>Письменный стол с кожаной вставкой</h3>\n        <p>Тонированный шпон корня, столешница со стёганой кожей, латунные ручки и башмачки. Габариты и высоту считали под конкретный кабинет.</p>\n        <dl><dt>Материалы</dt><dd>Шпон корня, массив, кожа</dd>\n            <dt>Отделка</dt><dd>Тонировка, полированный лак</dd>\n            <dt>Объект</dt><dd>Частный кабинет</dd></dl>\n        <p class=\"tip\">Потяните разделитель, чтобы сравнить чертёж и результат</p>\n      </div>\n    </div>\n    <div class=\"slab\" data-slab=\"1\" hidden>\n      <div class=\"stage\" data-stage>\n        <img src=\"i/v1-komod.webp\" style=\"object-position:42% 55%\" alt=\"Готовый комод\">\n        <div class=\"st-front\"><img src=\"i/v1-sketch2.webp\" style=\"object-position:50% 55%\" alt=\"Эскиз комода с размерами\"></div>\n        <div class=\"st-bar\"></div><div class=\"st-knob\"></div>\n        <div class=\"st-lab l\">Эскиз</div><div class=\"st-lab r\">Изделие</div>\n      </div>\n      <div class=\"said\">\n        <h3>Комод с кассетными фасадами</h3>\n        <p>Кассеты обтянуты стёганой кожей, корпус в шпоне корня, ручки латунь. На чертеже те же 1500 мм по фасаду, что и в готовом изделии.</p>\n        <dl><dt>Материалы</dt><dd>Шпон, массив, кожа</dd>\n            <dt>Отделка</dt><dd>Тонировка, глянцевый лак</dd>\n            <dt>Объект</dt><dd>Загородный дом</dd></dl>\n        <p class=\"tip\">Потяните разделитель, чтобы сравнить чертёж и результат</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section class=\"note\" data-note=\"Проекты по объектам, а не отдельными предметами\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\">\n      <div><h2>Проекты</h2>\n      <p>Работы собраны по объектам: видно всю квартиру целиком, а не отдельный шкаф без контекста.</p></div>\n      <a class=\"more\" href=\"#\">Все проекты</a>\n    </div>\n    <div class=\"filters\">\n      <button class=\"chip on\" data-f=\"\">Все</button><button class=\"chip\" data-f=\"кухн\">Кухни</button>\n      <button class=\"chip\" data-f=\"гардероб\">Гардеробные</button><button class=\"chip\" data-f=\"двер\">Двери</button>\n      <button class=\"chip\" data-f=\"панел\">Панели</button><button class=\"chip\" data-f=\"стол,консол\">Столы и консоли</button>\n    </div>\n    <div class=\"projects\"><a class=\"proj\" href=\"#\" data-kind=\"гардеробная шпон орех фризе алькантара\">\n      <div class=\"ph\"><img src=\"i/v1-garderob.webp\" alt=\"ЖК Зил Арт\" loading=\"lazy\"></div>\n      <div class=\"body\">\n        <div class=\"meta\"><span class=\"sq\">гардеробная с островом</span><span>Дизайн заказчика</span></div>\n        <h3>ЖК Зил Арт</h3>\n        <div class=\"items\"><span>Гардеробная</span><span>Шпон орех фризе</span><span>Алькантара</span></div>\n      </div></a><a class=\"proj\" href=\"#\" data-kind=\"панели тумба под тв шпон бук\">\n      <div class=\"ph\"><img src=\"i/v1-tumba.webp\" alt=\"Москва-Сити, башня Око\" loading=\"lazy\"></div>\n      <div class=\"body\">\n        <div class=\"meta\"><span class=\"sq\">апартаменты</span><span>Анастасия Федосеева</span></div>\n        <h3>Москва-Сити, башня Око</h3>\n        <div class=\"items\"><span>Панели</span><span>Тумба под ТВ</span><span>Шпон бук</span></div>\n      </div></a><a class=\"proj\" href=\"#\" data-kind=\"двери раздвижные поталь серебро\">\n      <div class=\"ph\"><img src=\"i/v1-konsol.webp\" alt=\"ЖК Континенталь\" loading=\"lazy\"></div>\n      <div class=\"body\">\n        <div class=\"meta\"><span class=\"sq\">квартира</span><span>Дизайн заказчика</span></div>\n        <h3>ЖК Континенталь</h3>\n        <div class=\"items\"><span>Двери</span><span>Раздвижные</span><span>Поталь серебро</span></div>\n      </div></a><a class=\"proj\" href=\"#\" data-kind=\"двери шпон корень тополя поталь\">\n      <div class=\"ph\"><img src=\"i/v1-gostinaya.webp\" alt=\"ЖК Итальянский квартал\" loading=\"lazy\"></div>\n      <div class=\"body\">\n        <div class=\"meta\"><span class=\"sq\">квартира</span><span>Дизайн заказчика</span></div>\n        <h3>ЖК Итальянский квартал</h3>\n        <div class=\"items\"><span>Двери</span><span>Шпон корень тополя</span><span>Поталь</span></div>\n      </div></a><a class=\"proj\" href=\"#\" data-kind=\"двери шпон файн-лайн латунный профиль\">\n      <div class=\"ph\"><img src=\"i/v1-shkaf.webp\" alt=\"ЖК Царская площадь\" loading=\"lazy\"></div>\n      <div class=\"body\">\n        <div class=\"meta\"><span class=\"sq\">квартира</span><span>Дизайн заказчика</span></div>\n        <h3>ЖК Царская площадь</h3>\n        <div class=\"items\"><span>Двери</span><span>Шпон файн-лайн</span><span>Латунный профиль</span></div>\n      </div></a><a class=\"proj\" href=\"#\" data-kind=\"двери шпон бубинга массив сапели\">\n      <div class=\"ph\"><img src=\"i/v1-interior.webp\" alt=\"Росрезерв\" loading=\"lazy\"></div>\n      <div class=\"body\">\n        <div class=\"meta\"><span class=\"sq\">кабинет руководителя</span><span>Дизайн заказчика</span></div>\n        <h3>Росрезерв</h3>\n        <div class=\"items\"><span>Двери</span><span>Шпон бубинга</span><span>Массив сапели</span></div>\n      </div></a></div>\n  </div>\n</section>\n\n<section class=\"note\" data-note=\"Материалы и отделка — доказательство профессионализма\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div><h2>Материалы и отделка</h2>\n      <p>Не работаем с ЛДСП. Только массив, шпон, столярная плита и МДФ под покраску.</p></div>\n      <a class=\"more\" href=\"#\">Подробно о материалах</a></div>\n\n    <div class=\"rows\">\n      <div class=\"row\">\n        <figure><img src=\"i/shpon-big-1.webp\" alt=\"Раскладка натурального шпона\" loading=\"lazy\"></figure>\n        <div class=\"row-txt\">\n          <div class=\"eyebrow\">Материалы</div>\n          <h3>Шпон, массив, столярная плита</h3>\n          <p>Больше сотни сортов шпона: экзотика, корневые срезы, файн-лайн. Рисунок собираем\n            в раскладку, чтобы двери и панели читались одним изделием. Массив ведём по канонам\n            столярного дела, со своими наработками против деформации полотна.</p>\n          <div class=\"veneer\">\n            <figure><span class=\"sw-img\"><img src=\"i/sh-3.webp\" alt=\"Шпон дуба\" loading=\"lazy\"></span><figcaption>Дуб</figcaption></figure>\n            <figure><span class=\"sw-img\"><img src=\"i/sh-2.webp\" alt=\"Шпон бука\" loading=\"lazy\"></span><figcaption>Бук</figcaption></figure>\n            <figure><span class=\"sw-img\"><img src=\"i/sh-4.webp\" alt=\"Шпон ореха\" loading=\"lazy\"></span><figcaption>Орех</figcaption></figure>\n            <figure><span class=\"sw-img\"><img src=\"i/sh-5.webp\" alt=\"Шпон вишни\" loading=\"lazy\"></span><figcaption>Вишня</figcaption></figure>\n            <figure><span class=\"sw-img\"><img src=\"i/sh-6.webp\" alt=\"Шпон ясеня\" loading=\"lazy\"></span><figcaption>Ясень</figcaption></figure>\n            <figure><span class=\"sw-img\"><img src=\"i/sh-9.webp\" alt=\"Шпон эвкалипта\" loading=\"lazy\"></span><figcaption>Эвкалипт</figcaption></figure>\n          </div>\n          <ul class=\"chipset\"><li>эбен-макасар</li><li>бубинга</li><li>сикамора</li>\n            <li>корень тополя</li><li>анегри</li><li>файн-лайн</li><li>и ещё сотни</li></ul>\n        </div>\n      </div>\n\n      <div class=\"row rev\">\n        <figure><img src=\"i/furnitura.webp\" alt=\"Фурнитура Blum, Häfele, Hettich\" loading=\"lazy\"></figure>\n        <div class=\"row-txt\">\n          <div class=\"eyebrow\">Фурнитура</div>\n          <h3>Механика, которой пользуются каждый день</h3>\n          <p>На дверях и ящиках экономить нельзя — они изнашиваются первыми. Скрытые петли\n            и доводчики, выпадающие пороги, выдвижные штанги и брючницы, подсветка с датчиком\n            движения. На механику есть заводская гарантия.</p>\n          <ul class=\"chipset\"><li>Blum</li><li>Häfele</li><li>Hettich</li><li>скрытые петли</li>\n            <li>доводчики</li><li>выпадающие пороги</li></ul>\n        </div>\n      </div>\n\n      <div class=\"row\">\n        <figure><img src=\"i/otdelka.webp\" alt=\"Полировка глянца до зеркала\" loading=\"lazy\"></figure>\n        <div class=\"row-txt\">\n          <div class=\"eyebrow\">Отделка</div>\n          <h3>Тонировка, патина, эмаль, золочение</h3>\n          <p>Работаем по каталогам RAL и NCS или по вашему образцу. Для шпона и массива делаем\n            выкрасы на материале вашего изделия — цвет согласуете вживую, до запуска в цех,\n            а не по картинке на экране.</p>\n          <ul class=\"chipset\"><li>матовая эмаль</li><li>глянцевый лак</li><li>патина</li>\n            <li>поталь</li><li>браширование</li><li>перламутр</li><li>кракелюр</li><li>ручная роспись</li></ul>\n        </div>\n      </div>\n\n      <div class=\"row rev\">\n        <figure><img src=\"i/rezba-1.webp\" alt=\"Резные декоры\" loading=\"lazy\"></figure>\n        <div class=\"row-txt\">\n          <div class=\"eyebrow\">Резьба и декор</div>\n          <h3>Ручная и станочная резьба</h3>\n          <p>Наличники, карнизы, панно, накладные декоры. Сложные элементы режем вручную,\n            повторяющиеся — на ЧПУ. Наборный шпон, веерные раскладки, инкрустация латунью.</p>\n          <ul class=\"chipset\"><li>ручная резьба</li><li>ЧПУ</li><li>наборный шпон</li>\n            <li>веерные раскладки</li><li>панно</li><li>латунь</li></ul>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<div class=\"strip note\" data-note=\"Лента работ: живая, останавливается при наведении\">\n  <div class=\"strip-in "n\">04</div><h3>В комплексе</h3><p>Двери делаем вместе со стеновыми панелями и встроенными шкафами, чтобы рисунок шпона совпадал.</p></div><div class=\"feat\"><div class=\"n\">05</div><h3>Образцы и выкрасы</h3><p>Перед запуском изготавливаем образец отделки и согласовываем его с вами.</p></div><div class=\"feat\"><div class=\"n\">06</div><h3>Разный цвет сторон</h3><p>Дверь может быть окрашена с двух сторон по-разному, под каждую комнату.</p></div>\n    </div>\n  </div>\n</section>\n<section class=\"craft note\" data-note=\"Работы этого раздела, привязанные к объектам\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div><h2>Двери, которые мы сделали</h2>\n      <p>Каждая работа привязана к объекту, поэтому видно двери в контексте всей квартиры.</p></div>\n      <a class=\"more\" href=\"#\">Все проекты</a></div>\n    <div class=\"gal\">\n      <figure><img src=\"i/dveri-3.webp\" alt=\"ЖК Итальянский квартал\" loading=\"lazy\"><figcaption><span class=\"obj\">ЖК Итальянский квартал</span>МДФ, столярная плита, шпон корень тополя. Поталь, тонировка, полуглянцевый лак</figcaption></figure><figure><img src=\"i/dveri-4.webp\" alt=\"ЖК Царская площадь\" loading=\"lazy\"><figcaption><span class=\"obj\">ЖК Царская площадь</span>Столярная плита, МДФ, латунный профиль, шпон файн-лайн</figcaption></figure><figure><img src=\"i/dveri-5.webp\" alt=\"Росрезерв\" loading=\"lazy\"><figcaption><span class=\"obj\">Росрезерв</span>Кабинет руководителя. Столярная плита, МДФ, шпон бубинга, массив сапели</figcaption></figure><figure><img src=\"i/dveri-6.webp\" alt=\"Москва-Сити, башня Око\" loading=\"lazy\"><figcaption><span class=\"obj\">Москва-Сити, башня Око</span>Столярная плита, шпон бук, зеркало, полированная нержавеющая сталь</figcaption></figure><figure><img src=\"i/dveri-7.webp\" alt=\"Плотников переулок\" loading=\"lazy\"><figcaption><span class=\"obj\">Плотников переулок</span>Столярная плита, шпон дуб, шпон сикамора, вставка под бронзу</figcaption></figure><figure><img src=\"i/dveri-1.webp\" alt=\"ЖК Континенталь\" loading=\"lazy\"><figcaption><span class=\"obj\">ЖК Континенталь</span>Раздвижные. МДФ, тонированное стекло. Серебряная поталь, эмаль серебро, патина</figcaption></figure>\n    </div>\n  </div>\n</section>\n<section class=\"note\" data-note=\"Материалы, фурнитура, отделка — стандартные блоки\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div><h2>Из чего делаем двери</h2></div></div>\n    <div class=\"mats\">\n      <div class=\"mat\"><img src=\"i/v1-otdelka.webp\" alt=\"Отделка\">\n        <div class=\"cap\"><h4>Отделка</h4><p>Эмаль, тонировка, патина, масло. Выкрасы согласуем до запуска.</p></div></div>\n      <div class=\"mat\"><img src=\"i/v1-furnitura.webp\" alt=\"Фурнитура\">\n        <div class=\"cap\"><h4>Фурнитура</h4><p>Скрытые петли, доводчики, выпадающие пороги. Blum, Häfele, Hettich.</p></div></div>\n      <div class=\"mat\"><img src=\"i/v1-dekor.webp\" alt=\"Декор\">\n        <div class=\"cap\"><h4>Декор</h4><p>Резьба, наборный шпон, латунные вставки, роспись по эскизу.</p></div></div>\n      <div class=\"mat\"><img src=\"i/v1-stol.webp\" alt=\"Материалы\">\n        <div class=\"cap\"><h4>Материалы</h4><p>Массив дуба, бука, ясеня и ореха, шпон ценных пород, столярная плита, фанера, влагостойкий и огнеупорный МДФ. С ЛДСП не работаем.</p></div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"craft note\" data-note=\"Типы дверей: то, за чем приходят с проектом\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div><h2>Какие двери делаем</h2>\n      <p>Пять направлений, внутри каждого любая форма, размер и отделка под ваш проект.</p></div></div>\n    <div class=\"types\">\n      <div class=\"type\"><div class=\"n\">01</div><div><h3>Фанерованные шпоном</h3><p>Более сотни сортов шпона: экзотические породы, корневые срезы, эко-шпон и файн-лайн. Рисунок собираем в раскладку, чтобы полотно читалось цельным.</p></div></div><div class=\"type\"><div class=\"n\">02</div><div><h3>Из 100% массива</h3><p>Изготавливаем по канонам столярного дела, плюс свои наработки против деформации полотна и коробки. Любая модель по вашим эскизам и проёмам.</p></div></div><div class=\"type\"><div class=\"n\">03</div><div><h3>Эмаль, патина, поталь</h3><p>Наличники и карниз с резьбой или без, десяток видов отделки и спецэффектов: патинирование, золочение, браширование, кракелюр, перламутр, металлик, хамелеон, роспись.</p></div></div><div class=\"type\"><div class=\"n\">04</div><div><h3>Входные и уличные</h3><p>Двери и накладки на металлические, любого размера и дизайна. Перед заказом обсуждаем условия эксплуатации изделий из натурального дерева.</p></div></div><div class=\"type\"><div class=\"n\">05</div><div><h3>Раздвижные и перегородки</h3><p>Пеналы, откатные системы, межкомнатные перегородки. Механику закладываем на этапе чертежа, вместе со скрытыми доводчиками и выпадающими порогами.</p></div></div>\n    </div>\n  </div>\n</section>\n\n<section class=\"note\" data-note=\"Как заказать: снимает страх «а как это происходит»\">\n  <div class=\"wrap\">\n    <div class=\"sec-head\"><div><h2>Как заказать</h2>\n      <p>Шесть этапов от заявки до гарантийного обслуживания. На каждом понятно, что нужно от вас и что вы получаете.</p></div></div>\n    <div class=\"order\">\n      <div class=\"ostep\"><div class=\"n\">01</div><div><h3>Заявка на просчёт</h3><p>Пришлите заявку на почту, в WhatsApp или Telegram. Перезвоним и уточним детали: габариты, желаемые материалы, тип отделки. Фото, эскиз или визуализация ускорят расчёт. В кратчайшие сроки пришлём коммерческое предложение.</p></div></div><div class=\"ostep\"><div class=\"n\">02</div><div><h3>Договор на изготовление</h3><p>Окончательная цена, сроки изготовления и монтажа фиксируются в договоре и спецификациях. Там же гарантийные обязательства и условия оплаты. Работаем по предоплате, возможна рассрочка платежей.</p></div></div><div class=\"ostep\"><div class=\"n\">03</div><div><h3>Проектирование и 3D-модель</h3><p>Конструктор при не рма ничего не отправляет. Стоимость называем после разбора проекта.</p>\n    </form>\n  </div>\n</section>\n<div class=\"foot\"><div class=\"wrap\"><div class=\"foot-in\">\n  <div><div class=\"brand\">Мебель 20<span>Столярное производство полного цикла. Больше десяти лет в мастерской на Иркутской.</span></div></div>\n  <div><h5>Изготовление</h5><ul>\n    <li><a href=\"#\">Кухни</a></li><li><a href=\"#\">Шкафы и гардеробные</a></li>\n    <li><a href=\"#\">Двери</a></li><li><a href=\"#\">Стеновые панели</a></li>\n    <li><a href=\"#\">Столы и консоли</a></li><li><a href=\"#\">Резьба и панно</a></li></ul></div>\n  <div><h5>О работе</h5><ul>\n    <li><a href=\"#\">Материалы</a></li><li><a href=\"#\">Фурнитура</a></li>\n    <li><a href=\"#\">Отделка</a></li><li><a href=\"#\">Этапы работы</a></li>\n    <li><a href=\"#\">Архитекторам</a></li></ul></div>\n  <div><h5>Связаться</h5><ul>\n    <li><a href=\"#\">+7 (925) 794-39-10</a></li>\n    <li><a href=\"#\">Написать в Telegram</a></li>\n    <li><a href=\"#\">Прислать проект на просчёт</a></li>\n    <li>Москва, ул. Иркутская, д. 17, стр. 9</li></ul></div>\n</div><div class=\"foot-bottom\"><span>© 2026 Мебель 20</span><span>Производство мебели на заказ по дизайн-проектам</span></div>\n</div></div>"};
const host = document.getElementById('screen');

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function reveal(){
  if (reduced || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      const el = e.target;
      const d = el.dataset.d ? parseFloat(el.dataset.d) : 0;
      el.style.transitionDelay = d + 's';
      el.classList.add('in');
      io.unobserve(el);
    });
  }, {rootMargin: '0px 0px -8% 0px', threshold: .06});
  host.querySelectorAll('section > .wrap > *, .strip, .foot-in > *').forEach(function(el){
    if (el.closest('.hero')) return;
    el.classList.add('rv'); io.observe(el);
  });
  host.querySelectorAll('.projects > *, .mats > *, .feats > *, .gal > *, .types > *, .order > *, .rows > *').forEach(function(el, i){
    el.classList.add('rv'); el.dataset.d = Math.min((i % 6) * .085, .43); io.observe(el);
  });
  setTimeout(function(){
    host.querySelectorAll('.rv:not(.in)').forEach(function(el){
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight) el.classList.add('in');
    });
  }, 2200);
}

function counters(){
  if (reduced || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      const el = e.target, raw = el.textContent.trim();
      const num = parseInt(raw.replace(/\D/g, ''), 10);
      if (!num) return;
      const tail = raw.replace(/[0-9]/g, '');
      let t0 = null;
      function step(ts){
        if (t0 === null) t0 = ts;
        const p = Math.min((ts - t0) / 900, 1);
        const e2 = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(num * e2) + tail;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      io.unobserve(el);
    });
  }, {threshold: .5});
  host.querySelectorAll('.stat b, .stats .line b').forEach(function(el){ io.observe(el); });
}

function parallax(){
  if (reduced) return;
  const img = host.querySelector('.hero-img img');
  if (!img) return;
  let raf = null;
  function frame(){
    raf = null;
    const box = img.closest('.hero-img');
    if (!box) return;
    const r = box.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) return;
    // сдвигаем кадр максимум на 26 пикселей за весь проход экрана:
    // движение должно читаться как глубина, а не как отдельный эффект
    const p = (r.top + r.height / 2 - window.innerHeight / 2) / window.innerHeight;
    img.style.transform = 'scale(1.06) translate3d(0,' + (p * 26).toFixed(1) + 'px,0)';
  }
  function onScroll(){ if (raf === null) raf = requestAnimationFrame(frame); }
  if (!parallax.bound) {
    // экраны переключаются без перезагрузки: подписка одна на всё время жизни
    // страницы, а актуальный кадр подставляем при каждом показе
    window.addEventListener('scroll', function(){ if (parallax.frame) parallax.frame(); }, {passive: true});
    window.addEventListener('resize', function(){ if (parallax.frame) parallax.frame(); }, {passive: true});
    parallax.bound = true;
  }
  parallax.frame = onScroll;
  frame();
}

function selects(){
  host.querySelectorAll('.form select').forEach(function(sel){
    if (sel.parentElement.classList.contains('sel')) return;
    const wrap = document.createElement('div');
    wrap.className = 'sel';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sel-btn';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = sel.options[sel.selectedIndex].text;
    wrap.appendChild(btn);

    const list = document.createElement('div');
    list.className = 'sel-list';
    list.setAttribute('role', 'listbox');
    Array.prototype.forEach.call(sel.options, function(o, i){
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', String(i === sel.selectedIndex));
      b.textContent = o.text;
      b.addEventListener('click', function(){
        sel.selectedIndex = i;
        btn.textContent = o.text;
        list.querySelectorAll('button').forEach(function(x, xi){
          x.setAttribute('aria-selected', String(xi === i));
        });
        close();
      });
      list.appendChild(b);
    });
    wrap.appendChild(list);

    function open(){
      host.querySelectorAll('.sel.open').forEach(function(o){
        if (o !== wrap) { o.classList.remove('open'); o.querySelector('.sel-btn').setAttribute('aria-expanded','false'); }
      });
      wrap.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
    function close(){
      wrap.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
    }
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      wrap.classList.contains('open') ? close() : open();
    });
    btn.addEventListener('keydown', function(e){
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  });

  if (!selects.bound) {
    document.addEventListener('click', function(){
      document.querySelectorAll('.sel.open').forEach(function(o){
        o.classList.remove('open');
        const b = o.querySelector('.sel-btn');
        if (b) b.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('keydown', function(e){
      if (e.key !== 'Escape') return;
      document.querySelectorAll('.sel.open').forEach(function(o){ o.classList.remove('open'); });
    });
    selects.bound = true;
  }
}

function slider(){
  host.querySelectorAll('[data-stage]').forEach(function(st){
    const front = st.querySelector('.st-front'),
          bar = st.querySelector('.st-bar'),
          knob = st.querySelector('.st-knob');
    function size(){ st.style.setProperty('--sw', st.clientWidth + 'px'); }
    function put(p){
      p = Math.max(4, Math.min(96, p));
      front.style.width = p + '%'; bar.style.left = p + '%'; knob.style.left = p + '%';
    }
    size();
    if (window.ResizeObserver) new ResizeObserver(size).observe(st);
    put(50);
    let drag = false;
    function at(e){
      const r = st.getBoundingClientRect();
      put(((e.clientX - r.left) / r.width) * 100);
    }
    st.addEventListener('pointerdown', function(e){
      drag = true; st.setPointerCapture(e.pointerId); at(e); st.dataset.touched = '1';
    });
    st.addEventListener('pointermove', function(e){ if (drag) at(e); });
    st.addEventListener('pointerup', function(){ drag = false; });
    st.addEventListener('pointercancel', function(){ drag = false; });

    if (reduced || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (!e.isIntersecting || st.dataset.touched) return;
        io.unobserve(st);
        const keys = [[0, 50], [500, 82], [1500, 22], [2500, 50]];
        let t0 = null, i = 0;
        function play(ts){
          if (t0 === null) t0 = ts;
          const t = ts - t0;
          while (i < keys.length - 1 && t > keys[i + 1][0]) i++;
          if (i >= keys.length - 1) { put(50); return; }
          const a = keys[i], b = keys[i + 1];
          const p = (t - a[0]) / (b[0] - a[0]);
          const e2 = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          if (!st.dataset.touched) { put(a[1] + (b[1] - a[1]) * e2); requestAnimationFrame(play); }
        }
        requestAnimationFrame(play);
      });
    }, {threshold: .45});
    io.observe(st);
  });
}

function slabs(){
  const tabs = host.querySelectorAll('.ct');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      host.querySelectorAll('.slab').forEach(function(s){
        const on = s.dataset.slab === t.dataset.slab;
        s.hidden = !on;
        if (on) { s.style.animation = 'none'; void s.offsetWidth; s.style.animation = 'swap .4s cubic-bezier(.2,.75,.25,1) both'; }
      });
    });
  });
}

function render(name){
  host.innerHTML = S[name];
  host.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      const box = c.parentElement;
      box.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('on'); });
      c.classList.add('on');

      // фильтр отбирает карточки по составу работ из data-kind
      const grid = box.parentElement.querySelector('.projects');
      if (!grid) return;
      const need = (c.getAttribute('data-f') || '').split(',').filter(Boolean);
      let shown = 0;
      grid.querySelectorAll('.proj').forEach(function(card){
        const kind = card.getAttribute('data-kind') || '';
        const ok = !need.length || need.some(function(n){ return kind.indexOf(n) !== -1; });
        card.style.display = ok ? '' : 'none';
        if (ok) shown++;
      });
      let empty = grid.parentElement.querySelector('.no-hits');
      if (!empty) {
        empty = document.createElement('p');
        empty.className = 'no-hits';
        empty.textContent = 'В этой категории пока нечего показать — посмотрите все объекты.';
        grid.parentElement.appendChild(empty);
      }
      empty.style.display = shown ? 'none' : 'block';
    });
  });

  // Ссылки-заглушки прототипа: без этого любой клик уносит страницу наверх.
  host.querySelectorAll('a[href="#"]').forEach(function(el){
    el.addEventListener('click', function(e){ e.preventDefault(); });
  });

  // Картинки внутри шторки сравнения браузер по умолчанию тащит как файл,
  // из-за чего перетаскивание разделителя срывается после первого движения.
  host.querySelectorAll('[data-stage] img').forEach(function(im){
    im.setAttribute('draggable', 'false');
    im.style.webkitUserDrag = 'none';
    im.style.userSelect = 'none';
  });
  // подсветку в шапке ведём за открытым экраном, иначе «Главная» горит всегда
  const navMap = {home: 'ГЛАВНАЯ', proj: 'ПРОЕКТЫ', sec: 'ИЗГОТОВЛЕНИЕ'};
  host.querySelectorAll('.nav a').forEach(function(el){
    el.classList.toggle('on', el.textContent.trim().toUpperCase() === navMap[name]);
  });
  document.body.classList.add('anim');
  reveal(); counters(); slider(); slabs(); lightbox(); parallax(); selects();
  host.classList.remove('swap'); void host.offsetWidth; host.classList.add('swap');
  window.scrollTo(0, 0);
}

document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected','false'); });
    t.setAttribute('aria-selected','true');
    render(t.dataset.s);
  });
});

document.getElementById('notes').addEventListener('change', function(e){
  document.body.classList.toggle('show-notes', e.target.checked);
});

render('home');
</script>
