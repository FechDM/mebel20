<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Мебель 20 — вариант 2 «Производство»</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100E0C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23C9A227'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#100E0C; --bg-2:#171412; --bg-3:#1F1B17; --line:#2C2723;
  --ink:#EFE9E0; --ink-2:#B9AFA2; --ink-3:#857A6C;
  --brass:#C9A227; --brass-2:#E3C463; --brass-dim:rgba(201,162,39,.14);
  --f:'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --pad:clamp(20px,5vw,64px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;line-height:1.1}
p{margin:0 0 1em}

/* ————— панель прототипа ————— */
.bar{position:sticky;top:0;z-index:80;background:rgba(16,14,12,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px var(--pad);flex-wrap:wrap;
  font-size:13px}
.bar b{font-weight:600;letter-spacing:.02em}
.bar .back{color:var(--ink-3);font-size:12px}
.bar .back:hover{color:var(--brass-2)}
.toggle{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);cursor:pointer;
  user-select:none;white-space:nowrap}
.toggle input{accent-color:var(--brass);width:15px;height:15px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:999px;color:var(--ink-2);font-size:13px;
  border:1px solid transparent;transition:.18s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--brass-dim);border-color:rgba(201,162,39,.35);color:var(--brass-2)}

/* ————— подписи структуры ————— */
.note{display:none}
body.notes .note{display:block;position:relative;margin:0 0 -6px;
  font:500 11px/1.5 var(--fm);letter-spacing:.04em;text-transform:uppercase;
  color:#0F0D0B;background:var(--brass-2);padding:5px 11px;border-radius:0 8px 8px 0;
  width:fit-content;max-width:min(94%,760px);z-index:6}
body.notes .note em{font-style:normal;opacity:.72;text-transform:none;letter-spacing:0}
body.notes section{outline:1px dashed rgba(201,162,39,.3);outline-offset:-1px}

/* ————— шапка сайта ————— */
.nav{position:relative;z-index:40;display:flex;align-items:center;gap:28px;
  padding:20px var(--pad);border-bottom:1px solid rgba(255,255,255,.07)}
.logo{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:.14em;font-size:15px}
.logo span{width:7px;height:7px;background:var(--brass);border-radius:50%;transform:translateY(-2px)}
.menu{display:flex;gap:22px;font-size:14px;color:var(--ink-2);margin-left:16px;flex-wrap:wrap}
.menu a:hover{color:var(--brass-2)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:18px}
.tel{font:500 15px/1 var(--fm);letter-spacing:.02em;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 22px;border-radius:2px;font-weight:600;font-size:14px;letter-spacing:.01em;
  background:var(--brass);color:#100E0C;transition:.2s;border:1px solid var(--brass)}
.btn:hover{background:var(--brass-2);border-color:var(--brass-2)}
.btn.ghost{background:none;color:var(--ink);border-color:rgba(255,255,255,.22)}
.btn.ghost:hover{border-color:var(--brass);color:var(--brass-2);background:none}
.burger{display:none}

/* ————— hero ————— */
.hero{position:relative;padding:0;min-height:min(86vh,760px);display:flex;align-items:flex-end;
  overflow:hidden;border-bottom:1px solid var(--line)}
.hero-bg{position:absolute;inset:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:52% 42%}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(16,14,12,.72) 0%,rgba(16,14,12,.42) 38%,rgba(16,14,12,.93) 100%)}
.hero-in{position:relative;z-index:2;width:100%;padding:0 0 clamp(30px,5vw,58px)}
.kicker{font:500 11px/1 var(--fm);letter-spacing:.22em;text-transform:uppercase;
  color:var(--brass-2);margin:0 0 20px;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:34px;height:1px;background:var(--brass)}
.hero h1{font-size:clamp(30px,5.2vw,62px);max-width:15ch;font-weight:600}
.hero h1 i{font-style:normal;color:var(--brass-2)}
.hero .lead{margin:22px 0 30px;font-size:clamp(15px,1.9vw,19px);color:var(--ink-2);
  max-width:56ch;font-weight:300}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}

/* ————— цифры ————— */
.nums{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);
  background:var(--bg-2)}
.num{padding:clamp(20px,3vw,34px) clamp(14px,2.4vw,30px);border-right:1px solid var(--line)}
.num:last-child{border-right:0}
.num b{display:block;font-size:clamp(26px,3.6vw,44px);font-weight:600;letter-spacing:-.03em;
  line-height:1;color:var(--ink)}
.num b i{font-style:normal;font-size:.5em;color:var(--brass);margin-left:3px;letter-spacing:0}
.num span{display:block;margin-top:9px;font-size:13px;color:var(--ink-3);line-height:1.35}

/* ————— общие секции ————— */
section{position:relative;padding:clamp(56px,8vw,116px) 0}
section.tight{padding:clamp(40px,5.5vw,72px) 0}
.alt{background:var(--bg-2)}
.head{max-width:64ch;margin:0 0 clamp(30px,4.5vw,56px)}
.head h2{font-size:clamp(24px,3.9vw,44px)}
.head p{margin:18px 0 0;color:var(--ink-2);font-size:clamp(15px,1.7vw,17px);font-weight:300}
.head.center{margin-left:auto;margin-right:auto;text-align:center}
.eyebrow{font:500 11px/1 var(--fm);letter-spacing:.2em;text-transform:uppercase;
  color:var(--brass);margin:0 0 16px}

/* ————— приветствие ————— */
.greet{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,72px);align-items:start}
.greet h2{font-size:clamp(23px,3.4vw,38px);font-weight:500;line-height:1.22;letter-spacing:-.02em}
.greet h2 b{font-weight:600;color:var(--brass-2)}
.greet .body{color:var(--ink-2);font-weight:300;font-size:16.5px}
.greet .body p+p{margin-top:1em}
.claims{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:1px;background:var(--line);
  border:1px solid var(--line)}
.claims li{background:var(--bg);padding:15px 18px 15px 36px;position:relative;font-size:15px;
  color:var(--ink-2)}
.alt .claims li{background:var(--bg-2)}
.claims li::before{content:"—";color:var(--brass);position:absolute;left:17px;top:15px}
.claims b{font-weight:600;color:var(--ink)}

/* ————— каталог ————— */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.cell{position:relative;background:var(--bg);display:block;overflow:hidden}
.cell .ph{aspect-ratio:4/3;overflow:hidden;background:var(--bg-3)}
.ph.empty{display:grid;place-items:center;text-align:center;padding:16px;
  background:
    repeating-linear-gradient(135deg,rgba(201,162,39,.05) 0 2px,transparent 2px 9px),
    linear-gradient(160deg,#221D18,#171412)}
.ph.empty span{font:400 11.5px/1.5 var(--fm);letter-spacing:.06em;color:var(--ink-3);
  text-transform:uppercase}
.ph.empty span b{display:block;font-size:22px;color:rgba(201,162,39,.5);margin-bottom:9px;
  font-weight:400;letter-spacing:.1em}
.cell .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.cell:hover .ph img{transform:scale(1.05)}
.cell .tx{padding:17px 19px 20px}
.cell h3{font-size:17px;font-weight:600}
.cell p{margin:7px 0 0;font-size:13.5px;color:var(--ink-3);line-height:1.5}
.cell .go{position:absolute;top:13px;right:13px;width:31px;height:31px;border-radius:50%;
  background:rgba(16,14,12,.72);display:grid;place-items:center;color:var(--brass-2);
  font-size:14px;opacity:0;transform:translateY(-4px);transition:.25s}
.cell:hover .go{opacity:1;transform:none}

/* ————— производство ————— */
.prod{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(26px,4.5vw,64px);align-items:center}
.prod-img{position:relative;border:1px solid var(--line)}
.prod-img img{width:100%}
.prod-img figcaption{position:absolute;left:0;bottom:0;right:0;padding:12px 15px;
  background:linear-gradient(0deg,rgba(16,14,12,.92),transparent);
  font:400 12px/1.4 var(--fm);color:var(--ink-2)}
.specs{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--line);
  border:1px solid var(--line)}
.specs li{background:var(--bg-2);padding:15px 18px;display:flex;gap:16px;align-items:baseline;
  font-size:15px}
.specs li:hover{background:var(--bg-3)}
.specs .k{font:500 12px/1.4 var(--fm);color:var(--brass);flex:none;width:52px;letter-spacing:.02em}
.specs .v b{font-weight:600}
.specs .v span{display:block;color:var(--ink-3);font-size:13.5px;margin-top:3px}

/* ————— объекты ————— */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px}
.fl{padding:7px 15px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;
  color:var(--ink-2);transition:.18s}
.fl:hover{border-color:var(--ink-3);color:var(--ink)}
.fl.on{background:var(--brass-dim);border-color:rgba(201,162,39,.45);color:var(--brass-2)}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:clamp(14px,2vw,24px)}
.obj{border:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;
  transition:.25s}
.obj:hover{border-color:rgba(201,162,39,.42);transform:translateY(-3px)}
.obj .ph{aspect-ratio:3/2;overflow:hidden;background:var(--bg-3);cursor:zoom-in}
.obj .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.obj:hover .ph img{transform:scale(1.045)}
.obj .tx{padding:17px 19px 19px;display:flex;flex-direction:column;gap:10px;flex:1}
.obj h3{font-size:16.5px;font-weight:600;line-height:1.28}
.obj .place{font:400 12px/1 var(--fm);color:var(--brass);letter-spacing:.04em;text-transform:uppercase}
.obj .mat{margin:0;font-size:13.5px;color:var(--ink-3);line-height:1.55}
.obj .mat b{color:var(--ink-2);font-weight:500}

/* ————— материалы ————— */
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.mat-c{background:var(--bg);padding:0}
.alt .mat-c{background:var(--bg-2)}
.mat-c .ph{aspect-ratio:16/10;overflow:hidden}
.mat-c .ph img{width:100%;height:100%;object-fit:cover}
.mat-c .tx{padding:20px 21px 24px}
.mat-c h3{font-size:17.5px;margin-bottom:9px}
.mat-c ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.mat-c li{font:400 12px/1 var(--fm);padding:6px 10px;border:1px solid var(--line);
  color:var(--ink-2);border-radius:2px}
.mat-c p{margin:0;font-size:14.5px;color:var(--ink-3);line-height:1.55}

/* ————— отделка: свотчи ————— */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);margin-top:26px}
.sw div{background:var(--bg-2);padding:16px 15px;display:flex;flex-direction:column;gap:10px}
.sw i{display:block;height:44px;border-radius:2px}
.sw b{font-size:14px;font-weight:500}
.sw span{font-size:12.5px;color:var(--ink-3);line-height:1.4}

/* ————— этапы ————— */
.steps{border:1px solid var(--line);display:grid;gap:1px;background:var(--line)}
.step{background:var(--bg)}
.alt .step{background:var(--bg-2)}
.step>button{width:100%;display:flex;align-items:center;gap:clamp(14px,2.5vw,26px);
  padding:19px clamp(16px,2.4vw,24px);text-align:left}
.step .n{font:500 12px/1 var(--fm);color:var(--brass);flex:none;letter-spacing:.06em}
.step .t{font-size:clamp(15.5px,1.9vw,18px);font-weight:500;flex:1}
.step .pm{flex:none;width:26px;height:26px;border:1px solid var(--line);display:grid;
  place-items:center;color:var(--ink-2);font-size:15px;transition:.2s}
.step[open] .pm,.step.open .pm{background:var(--brass);border-color:var(--brass);color:#100E0C}
.step .c{padding:0 clamp(16px,2.4vw,24px) 22px;color:var(--ink-2);font-size:15px;
  max-width:88ch;font-weight:300}
.step .c[hidden]{display:none}

/* ————— гарантия ————— */
.guar{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(18px,3vw,36px)}
.guar div h3{font-size:clamp(19px,2.4vw,25px);margin-bottom:10px}
.guar div h3 i{font-style:normal;color:var(--brass-2)}
.guar div p{margin:0;color:var(--ink-2);font-size:15px;font-weight:300}

/* ————— форма ————— */
.form-w{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,5vw,72px);align-items:start}
.form{display:grid;gap:14px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:block}
.f span{display:block;font:500 11px/1 var(--fm);letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px}
.f input,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);padding:13px 15px;font:400 15px var(--f);border-radius:2px;transition:.18s}
.alt .f input,.alt .f textarea{background:var(--bg-3)}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--brass)}
.f textarea{min-height:104px;resize:vertical}
.hint{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.contacts{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.contacts div{background:var(--bg-2);padding:17px 19px}
.contacts .k{font:500 11px/1 var(--fm);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.contacts .v{margin-top:7px;font-size:16px}
.contacts .v small{display:block;color:var(--ink-3);font-size:13.5px;margin-top:4px}

/* ————— футер ————— */
footer{border-top:1px solid var(--line);background:var(--bg-2);padding:clamp(34px,5vw,60px) 0 30px}
.f-top{display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;
  padding-bottom:26px;border-bottom:1px solid var(--line)}
.f-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:26px;margin-top:26px;font-size:14px}
.f-cols h4{margin:0 0 13px;font-size:11px;font-family:var(--fm);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);font-weight:500}
.f-cols a,.f-cols p{display:block;color:var(--ink-2);margin:0 0 8px}
.f-cols a:hover{color:var(--brass-2)}
.f-bot{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:12.5px;color:var(--ink-3)}

/* ————— лайтбокс ————— */
.lb{position:fixed;inset:0;z-index:120;background:rgba(8,7,6,.94);display:none;
  align-items:center;justify-content:center;padding:26px}
.lb.on{display:flex}
.lb img{max-width:min(1100px,94vw);max-height:82vh;object-fit:contain}
.lb .cap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:var(--ink-2);
  font:400 13.5px/1.5 var(--fm);padding:0 26px}
.lb .cl{position:absolute;top:18px;right:22px;font-size:30px;color:var(--ink-2);line-height:1}

/* ————— анимация появления ————— */
.rv{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.3,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* ————— мобильные ————— */
@media (max-width:900px){
  .greet,.prod,.form-w{grid-template-columns:1fr}
  .nums{grid-template-columns:1fr 1fr}
  .num:nth-child(2n){border-right:0}
  .num:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .menu{display:none}
  .prod-img{order:-1}
}
@media (max-width:620px){
  .nav{gap:14px;padding:14px var(--pad)}
  .tel{display:none}
  .nav-r .btn{padding:10px 15px;font-size:13px}
  .hero{min-height:auto;padding-top:clamp(150px,42vw,260px)}
  .fr{grid-template-columns:1fr}
  .kicker{letter-spacing:.13em;font-size:10px;gap:8px}
  .kicker::before{width:20px}
  .bar{gap:10px;padding:8px var(--pad)}
  .bar b{font-size:12px}
  .tabs{width:100%;margin-left:0;justify-content:flex-start}
  .tab{padding:5px 11px;font-size:12.5px}
}
</style>

<div class="bar">
  <b>Вариант 2 · Производство</b>

    <button class="tab" role="tab" aria-selected="false" data-s="sec">Гардеробные</button>
  </div>
</div>

<script>
/* ============ данные ============ */
const CAT = [
  [null,'Кухни','Корпус, фасады и столешница по проекту. Шпон, эмаль, массив.'],
  ['garderob-oreh','Гардеробные','Проектирование под аудит гардероба: штанги, брючницы, обувь, подсветка.'],
  [null,'Двери на заказ','Межкомнатные, входные, раздвижные. Скрытые петли и доводчики.'],
  ['shkafy','Шкафы','Встроенные и корпусные, под потолок, с интеграцией в стеновые панели.'],
  ['paneli','Стеновые панели','Шпон, 3D-фрезеровка, латунные профили, интеграция ТВ и света.'],
  ['konsol-steklo','Столы','Обеденные, письменные, консоли. Массив, шпон, стекло, металл.'],
  ['komod-ardeko','Комоды и тумбы','Штучные предметы: стёганая кожа, латунь, глянцевый лак.'],

};

/* ============ логика ============ */
const host = document.getElementById('screen');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderObjects(gridId, filtersId, limit){
  const grid = document.getElementById(gridId), fbox = document.getElementById(filtersId);
  if (!grid) return;
  const tags = ['все', ...new Set(OBJ.map(o => o[3]))];
  let active = 'все';
  if (fbox) fbox.innerHTML = tags.map(t =>
    `<button class="fl${t==='все'?' on':''}" data-t="${t}">${t}</button>`).join('');
  function draw(){
    const list = OBJ.filter(o => active==='все' || o[3]===active).slice(0, limit || 99);
    grid.innerHTML = list.map(([k,t,p,,m]) => `
      <article class="obj">
        ${k ? `<div class="ph" data-lb="${I(k)}" data-cap="${t} — ${p}"><img src="${I(k)}" alt="${t}" loading="lazy"></div>`
            : `<div class="ph empty"><span><b>◈</b>фото объекта<br>из архива производства</span></div>`}
        <div class="tx">
          <span class="place">${p}</span>
          <h3>${t}</h3>
          <p class="mat"><b>Материалы:</b> ${m}</p>
        </div>
      </article>`).join('');
    reveal();
  }
  if (fbox) fbox.onclick = e => {
    const b = e.target.closest('.fl'); if (!b) return;
    active = b.dataset.t;
    fbox.querySelectorAll('.fl').forEach(x => x.classList.toggle('on', x === b));
    draw();
  };
  draw();
}

function reveal(){
  if (reduced || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.style.transitionDelay = (e.target.dataset.d || 0) + 's';
    e.target.classList.add('in'); io.unobserve(e.target);
  }), {rootMargin:'0px 0px -6% 0px', threshold:.05});
  host.querySelectorAll('section > .wrap > *').forEach(el => {
    if (el.closest('.hero') || el.classList.contains('rv')) return;
    el.classList.add('rv'); io.observe(el);
  });
  host.querySelectorAll('.cell, .obj, .mat-c, .sw div').forEach((el,i) => {
    if (el.classList.contains('rv')) return;
    el.classList.add('rv'); el.dataset.d = Math.min(i*.05,.4); io.observe(el);
  });
  setTimeout(() => host.querySelectorAll('.rv:not(.in)').forEach(el => {
    if (el.getBoundingClientRect().top < innerHeight) el.classList.add('in');
  }), 40);
}

function show(name){
  host.innerHTML = SCREENS[name];
  document.querySelectorAll('.tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.s === name)));
  if (name === 'home') renderObjects('objgrid','filters',6);
  if (name === 'obj') renderObjects('objgrid2','filters2');
  scrollTo({top:0});
  reveal();
}

document.querySelector('.tabs').onclick = e => {
  const t = e.target.closest('.tab'); if (t) show(t.dataset.s);
};

document.getElementById('notes').onchange = e =>
  document.body.classList.toggle('notes', e.target.checked);

/* аккордеон + карточки каталога + лайтбокс */
const lb = document.getElementById('lb');
host.addEventListener('click', e => {
  const st = e.target.closest('.step > button');
  if (st){
    const step = st.parentElement, c = step.querySelector('.c'), open = !c.hidden;
    c.hidden = open; step.classList.toggle('open', !open);
    st.setAttribute('aria-expanded', String(!open));
    st.querySelector('.pm').textContent = open ? '+' : '–';
    return;
  }
  const cell = e.target.closest('[data-open]');
  if (cell){ e.preventDefault(); show(cell.dataset.open); return; }
  const ph = e.target.closest('[data-lb]');
  if (ph){
    lb.querySelector('img').src = ph.dataset.lb;
    lb.querySelector('.cap').textContent = ph.dataset.cap || '';
    lb.classList.add('on');
  }
});
lb.onclick = () => lb.classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });

show('home');
</script>
