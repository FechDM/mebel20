<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Мебель 20 — вариант 2 «Каталог»</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FBFAF8'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%2333503F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FBFAF8; --bg-2:#F3F1EC; --bg-3:#EAE7E0; --ink:#17181A; --ink-2:#4B4E52;
  --ink-3:#84878C; --line:#E0DDD5; --acc:#33503F; --acc-2:#4A6B55;
  --f:'Golos Text',-apple-system,'Segoe UI',Roboto,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --pad:clamp(20px,3vw,52px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--f);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:var(--bg);
  background-image:radial-gradient(90% 55% at 88% 4%,rgba(51,80,63,.045) 0%,transparent 62%),
    radial-gradient(70% 45% at 4% 42%,rgba(165,140,96,.05) 0%,transparent 60%);
  background-attachment:fixed}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{width:min(1680px,94vw);margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.08}
body{font-size:17px}
p{margin:0 0 1em}

/* ——— панель прототипа ——— */
.bar{position:sticky;top:0;z-index:80;background:rgba(251,250,248,.95);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px var(--pad);flex-wrap:wrap;font-size:13px}
.bar b{font:500 12px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.bar .back{color:var(--ink-3);font-size:12px}
.bar .back:hover{color:var(--acc)}
.toggle{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);cursor:pointer;
  user-select:none;white-space:nowrap;font-size:12.5px}
.toggle input{accent-color:var(--acc);width:15px;height:15px}
.tabs{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
.tab{padding:7px 14px;font-size:13px;color:var(--ink-3);border:1px solid transparent;transition:.16s}
@media (max-width:760px){
  .tab{min-height:44px;display:inline-flex;align-items:center;padding:8px 16px;font-size:14px}
  .toggle{min-height:44px}
  .menu a{padding:6px 0}
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* ——— подписи структуры ——— */
.note{display:none}
body.notes .note{display:block;position:relative;margin:0 0 10px;
  font:500 10.5px/1.5 var(--fm);letter-spacing:.08em;text-transform:uppercase;
  color:var(--acc);border-left:2px solid var(--acc);padding:2px 0 2px 10px;
  width:fit-content;max-width:min(94%,780px);z-index:6}
body.notes .note em{font-style:normal;color:var(--ink-3);text-transform:none;letter-spacing:0}
body.notes section{outline:1px dashed rgba(51,80,63,.22);outline-offset:-1px}

/* ——— шапка ——— */
.nav{position:relative;z-index:40;display:flex;align-items:center;gap:clamp(20px,2.6vw,44px);
  padding:clamp(16px,1.6vw,26px) var(--pad);border-bottom:1px solid var(--line)}
.logo{line-height:1;display:block}
.logo img{width:clamp(160px,14vw,214px);height:auto;display:block}
.logo i{font-style:normal;color:var(--acc)}
.logo span{display:block;font:400 9.5px/1.4 var(--fm);letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.menu{display:flex;gap:clamp(16px,1.5vw,28px);font-size:14.5px;color:var(--ink-2);flex-wrap:wrap}
.menu a{padding-bottom:2px;border-bottom:1px solid transparent}
.menu a:hover{color:var(--ink);border-color:var(--acc)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:clamp(14px,1.4vw,24px)}
.tel{font:500 15px/1.3 var(--f);white-space:nowrap;text-align:right}
.tel span{display:block;font:400 11.5px/1.3 var(--f);color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;
  padding:14px 26px;font-weight:500;font-size:14px;letter-spacing:.01em;
  background:var(--ink);color:var(--bg);border:1px solid var(--ink);transition:.2s}
.btn:hover{background:var(--acc);border-color:var(--acc)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lg{padding:17px 34px;font-size:15px}

/* ——— hero: фото во всю ширину, текст под ним ——— */
.hero{position:relative}
/* Первый экран собран по образцу текущего сайта: сверху полоса процесса
   (руки, инструмент, резьба), под ней композиция «источник → изделие».
   Логика клиента: принесите эскиз, чертёж или фото из каталога, сделаем. */
.strip-work{height:clamp(120px,15vw,220px);overflow:hidden;position:relative;background:#2A2320}
.strip-work img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;
  filter:sepia(.22) saturate(.9) contrast(1.04)}
.strip-work::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,17,15,.12),rgba(20,17,15,.32))}

.turn{position:relative;background:linear-gradient(178deg,#F4F2ED 0%,#EFEDE7 100%);
  border-bottom:1px solid var(--line);overflow:hidden}
.turn-in{position:relative;display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(16px,2.4vw,48px);align-items:center;
  padding:clamp(26px,3.4vw,58px) 0;min-height:clamp(300px,38vw,470px)}
.turn-side{display:grid;gap:clamp(10px,1.2vw,20px);grid-auto-flow:column;justify-content:start}
.turn-side figure{margin:0;background:#fff;padding:9px 9px 0;
  box-shadow:0 16px 38px rgba(31,28,24,.17);transition:transform .6s cubic-bezier(.2,.7,.25,1)}
.turn-side figure:nth-child(1){transform:rotate(-1.8deg)}
.turn-side figure:nth-child(2){transform:rotate(1.4deg) translateY(14px)}
.turn-side figure:hover{transform:rotate(0) translateY(-4px)}
.turn-side .ph{width:clamp(140px,15vw,240px);aspect-ratio:4/5;overflow:hidden;background:var(--bg-3)}
.turn-side img{width:100%;height:100%;object-fit:cover}
.turn-side figcaption{padding:9px 3px 11px;font:400 11.5px/1.3 var(--fm);
  letter-spacing:.02em;color:var(--ink-3);text-align:center}
.turn-done{justify-self:end}
.turn-done figure{transform:rotate(1.2deg)}
.turn-done .ph{width:clamp(180px,20vw,320px);aspect-ratio:3/4}
.turn-word{position:absolute;left:50%;top:clamp(18px,4vw,60px);transform:translateX(-50%);
  z-index:3;font-weight:700;letter-spacing:-.035em;white-space:nowrap;
  font-size:clamp(26px,4.4vw,64px);color:var(--ink);pointer-events:none;
  text-shadow:0 2px 24px rgba(244,242,237,.85)}
.turn-word i{font-style:normal;color:var(--acc)}
.turn-dots{position:absolute;left:50%;bottom:clamp(12px,1.6vw,24px);transform:translateX(-50%);
  display:flex;gap:9px;z-index:4}
.turn-dots button{width:9px;height:9px;border-radius:50%;border:1px solid var(--ink-3);
  background:transparent;padding:0;cursor:pointer;transition:.2s}
.turn-dots button[aria-current="true"]{background:var(--acc);border-color:var(--acc);transform:scale(1.25)}
.turn-state{display:none}
.turn-state.on{display:contents}
@media (max-width:860px){
  .turn-in{grid-template-columns:1fr;gap:18px;padding-top:clamp(58px,15vw,90px)}
  .turn-done{justify-self:center}
  .turn-side{justify-content:center}
  .turn-side .ph{width:clamp(118px,32vw,160px)}
  .turn-done .ph{width:clamp(150px,42vw,210px)}
  .turn-word{top:16px;font-size:clamp(22px,7vw,34px)}
}

.hero-ph{position:relative;height:clamp(340px,54vh,640px);overflow:hidden;background:var(--bg-3)}
.hero-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  will-change:transform;transition:transform .18s linear}
/* фото не обрывается линией, а растворяется в бумаге */
.hero-ph::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;pointer-events:none;
  background:linear-gradient(180deg,rgba(251,250,248,0) 0%,rgba(251,250,248,.22) 62%,rgba(251,250,248,.72) 100%)}
.hero-tag{position:absolute;left:0;bottom:0;background:var(--bg);
  padding:clamp(14px,1.5vw,22px) clamp(18px,2vw,30px);max-width:min(92vw,440px)}
.hero-tag b{display:block;font:500 11px/1 var(--fm);letter-spacing:.14em;
  text-transform:uppercase;color:var(--acc);margin-bottom:9px}
.hero-tag span{font-size:14px;color:var(--ink-2);line-height:1.5}
.hero-txt{display:grid;grid-template-columns:1.35fr .65fr;gap:clamp(24px,3.5vw,64px);
  align-items:end;padding:clamp(34px,4vw,64px) 0 clamp(30px,3.5vw,52px)}
.hero h1{font-size:clamp(34px,5.2vw,92px);letter-spacing:-.035em;max-width:19ch}
.hero h1 i{font-style:normal;color:var(--acc)}
.hero-side p{margin:0 0 20px;font-size:clamp(16px,1.2vw,21px);color:var(--ink-2)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}

/* ——— паспорт производства: выходные данные, а не плашка ——— */
.passport{margin:clamp(26px,3vw,42px) 0 0;padding:0;display:grid;
  gap:clamp(9px,.9vw,13px);max-width:520px}
.passport div{display:flex;align-items:baseline;gap:10px;font-size:14.5px}
.passport dt{flex:none;color:var(--ink-2);margin:0}
.passport .dots{flex:1;height:1px;transform:translateY(-3px);
  background:radial-gradient(circle,var(--ink-3) .9px,transparent .9px) repeat-x;
  background-size:5px 1px;opacity:.5}
.passport dd{flex:none;margin:0;font:500 15px/1 var(--fm);letter-spacing:-.01em;color:var(--ink)}
.passport dd em{font-style:normal;color:var(--ink-3);font-size:12.5px;margin-left:3px}

/* ——— секции ——— */
section{padding:clamp(52px,5.6vw,110px) 0;position:relative}
section.tight{padding:clamp(38px,4vw,72px) 0}
/* тональная подложка: бумага, а не заливка — очень мягкий перепад по вертикали */
.alt{background:linear-gradient(178deg,#F5F3EE 0%,#F1EFE9 52%,#EFECE5 100%)}
.alt::before,.alt::after{content:"";position:absolute;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--line) 14%,var(--line) 86%,transparent)}
.alt::before{top:0}.alt::after{bottom:0}
.dark{color:#F2F1EE;
  background:radial-gradient(120% 90% at 18% 0%,#212328 0%,#17181A 58%,#141517 100%)}
.dark .kicker{color:#9FBBA9}
.dark .lead,.dark p{color:#B9B9B6}
.kicker{font:500 11px/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;
  color:var(--acc);margin:0 0 18px}
.h-row{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(20px,3vw,60px);
  align-items:end;margin-bottom:clamp(28px,3.2vw,52px)}
.h-row h2{font-size:clamp(27px,3.4vw,62px)}
.h-row .lead{margin:0;color:var(--ink-2);font-size:clamp(16px,1.2vw,21px);max-width:52ch}
.more{font:500 12.5px/1 var(--f);letter-spacing:.03em;color:var(--acc);
  border-bottom:1px solid currentColor;padding-bottom:4px;white-space:nowrap;
  justify-self:start;align-self:end}

/* ——— приветствие ——— */
.intro{display:grid;grid-template-columns:1.25fr .75fr;gap:clamp(26px,4vw,80px)}
.intro h2{font-size:clamp(22px,2.5vw,44px);font-weight:500;line-height:1.2;letter-spacing:-.028em}
.intro h2 b{font-weight:600;color:var(--acc)}
.intro .col p{color:var(--ink-2);font-size:clamp(15px,1vw,17px)}
.tenets{list-style:none;margin:clamp(34px,4vw,64px) 0 0;padding:0;
  display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(30px,4vw,84px)}
.tenets li{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,1.6vw,26px);
  padding:clamp(18px,1.8vw,26px) 0;border-top:1px solid var(--line);align-items:baseline}
.tenets li:nth-child(-n+2){border-top:0}
.tenets b{display:block;font-size:clamp(16px,1.15vw,19px);margin-bottom:7px;letter-spacing:-.015em}
.tenets span{font-size:14px;color:var(--ink-3);line-height:1.55}
.tenets .n{font:500 10.5px/1.6 var(--fm);color:var(--acc);letter-spacing:.1em}

/* ——— каталог ——— */
.cat{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,1.7vw,32px)}
.cell{display:block;position:relative}
.cell .ph{aspect-ratio:4/3;overflow:hidden;background:var(--bg-3);position:relative}
.cell .ph img{width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.cell:hover .ph img{transform:scale(1.045)}
.cell .ph.empty{display:grid;place-items:center;
  background:linear-gradient(150deg,#EFEDE7,#E4E1D9)}
.cell .ph.empty span{font:400 11px/1.6 var(--fm);letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);text-align:center}
.cell .ph.empty span b{display:block;font-size:20px;color:rgba(51,80,63,.35);
  font-weight:400;margin-bottom:8px}
.cell .cap{display:flex;align-items:baseline;gap:12px;padding:16px 2px 0}
.cell .num{font:500 11px/1 var(--fm);color:var(--acc);letter-spacing:.08em;flex:none}
.cell h3{font-size:clamp(17px,1.25vw,22px);font-weight:600;letter-spacing:-.02em}
.cell p{margin:6px 0 0;font-size:14px;color:var(--ink-3);line-height:1.5;padding-left:29px}
@media (max-width:1000px){.cat{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.cat{grid-template-columns:1fr}}

/* ——— производство ——— */
.prod{display:grid;gap:clamp(26px,3vw,52px)}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,.9vw,16px)}
.shots figure{margin:0;position:relative;overflow:hidden;background:#1E2024}
.shots img{width:100%;aspect-ratio:5/4;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.shots figure:hover img{transform:scale(1.045)}
.shots figcaption{position:absolute;left:0;bottom:0;right:0;padding:16px 14px 11px;
  font:400 11.5px/1.4 var(--fm);letter-spacing:.03em;color:#E6E4DF;
  background:linear-gradient(0deg,rgba(15,16,18,.88),transparent)}
@media (max-width:900px){.shots{grid-template-columns:repeat(2,1fr)}}
.prod .lines{columns:2;column-gap:clamp(28px,3.4vw,70px)}
.prod .lines li{break-inside:avoid}
@media (max-width:820px){.prod .lines{columns:1}}
.prod-ph{position:relative;overflow:hidden;background:var(--bg-3)}
.prod-ph img{width:100%;aspect-ratio:16/11;object-fit:cover}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.dark .lines{border-color:#33353A}
.lines li{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,2vw,34px);
  padding:clamp(15px,1.5vw,22px) 0;border-bottom:1px solid var(--line);align-items:baseline}
.dark .lines li{border-color:#33353A}
.lines .k{font:500 11px/1 var(--fm);color:var(--acc);letter-spacing:.08em}
.dark .lines .k{color:#9FBBA9}
.lines b{display:block;font-size:clamp(16px,1.15vw,19px);font-weight:600;margin-bottom:5px;
  letter-spacing:-.015em}
.lines span{font-size:14px;color:var(--ink-3);line-height:1.5}
.dark .lines span{color:#9A9A98}

/* ——— объекты ——— */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 clamp(22px,2.4vw,34px)}
.fl{padding:9px 17px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);
  border-radius:100px;transition:.16s}
.fl:hover{border-color:var(--acc);color:var(--ink)}
.fl.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.objs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2vw,34px)}
@media (max-width:1100px){.objs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.objs{grid-template-columns:1fr}}
.obj{display:flex;flex-direction:column}
.obj .ph{aspect-ratio:3/2;overflow:hidden;background:var(--bg-3);cursor:zoom-in;position:relative}
.obj .ph img{width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.obj:hover .ph img{transform:scale(1.04)}
.obj .ph.empty{display:grid;place-items:center;cursor:default;
  background:linear-gradient(150deg,#EFEDE7,#E4E1D9)}
.obj .ph.empty span{font:400 11px/1.6 var(--fm);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);text-align:center}
.obj .ph.empty span b{display:block;font-size:20px;color:rgba(51,80,63,.35);
  font-weight:400;margin-bottom:8px}
.obj .tx{padding:16px 0 0}
.obj .place{font:500 10.5px/1 var(--fm);color:var(--acc);letter-spacing:.1em;text-transform:uppercase}
.obj h3{margin:10px 0 8px;font-size:clamp(17px,1.25vw,22px);font-weight:600;letter-spacing:-.02em}
.obj .spec{margin:0;font-size:13.5px;color:var(--ink-3);line-height:1.55;
  padding-top:11px;border-top:1px solid var(--line)}
.obj .spec b{color:var(--ink-2);font-weight:500}

/* ——— три блока: материалы, фурнитура, отделка ——— */
.trio{display:grid;gap:clamp(34px,4vw,80px)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,3vw,64px);align-items:center}
.duo.rev .duo-ph{order:2}
.duo-ph{overflow:hidden;background:var(--bg-3)}
.duo-ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
.duo h3{font-size:clamp(21px,2.1vw,38px);margin-bottom:16px}
.duo p{color:var(--ink-2);font-size:clamp(15px,1vw,17px);max-width:52ch}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px;padding:0;list-style:none}
.tags li{font:400 12.5px/1 var(--fm);padding:8px 12px;border:1px solid var(--line);color:var(--ink-2)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:24px}
.swatches div{background:var(--bg);padding:14px 14px 16px}
.alt .swatches div{background:var(--bg-2)}
.swatches i{display:block;height:38px;margin-bottom:11px}
.swatches b{display:block;font-size:13.5px;font-weight:500}
.swatches span{font-size:12px;color:var(--ink-3);line-height:1.4}

/* ——— палитра шпона: образцы в своём размере, без растягивания ——— */
.veneer{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,.8vw,14px);margin-top:22px}
.veneer figure{margin:0}
.veneer .sw-img{aspect-ratio:4/5;overflow:hidden;background:var(--bg-3);border:1px solid var(--line)}
.veneer img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.25,1)}
.veneer figure:hover img{transform:scale(1.06)}
.veneer figcaption{margin-top:9px;font:400 12.5px/1.35 var(--f);color:var(--ink-3)}
@media (max-width:900px){.veneer{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.veneer{grid-template-columns:repeat(2,1fr)}}

/* ——— портфолио: крупные вертикальные кадры, максимум три колонки ——— */
.objgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2vw,40px)}
@media (max-width:1100px){.objgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.objgrid{grid-template-columns:1fr}}
.obj .ph{aspect-ratio:3/4;overflow:hidden;background:var(--bg-3);position:relative}
.obj .ph img{width:100%;height:100%;object-fit:cover;
  transition:transform .8s cubic-bezier(.2,.7,.25,1)}
.obj:hover .ph img{transform:scale(1.04)}

/* ——— метки на изделии: точка на фото, подпись по наведению ——— */

/* ============ логика ============ */
const host = document.getElementById('screen');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function renderObjects(gridId, filtersId, limit){
  const grid = document.getElementById(gridId), fbox = document.getElementById(filtersId);
  if (!grid) return;
  const tags = ['все', ...new Set(OBJ.map(o => o[3]))];
  let active = 'все';
  if (fbox) fbox.innerHTML = tags.map(t =>
    `<button class="fl${t==='все'?' on':''}" data-t="${t}">${t}</button>`).join('');
  function draw(){
    const list = OBJ.filter(o => active==='все' || o[3]===active).slice(0, limit || 99);
    grid.innerHTML = list.map(([k,t,p,,m]) => `
      <article class="obj">
        ${ph(k, t, `${t} — ${p}`)}
        <div class="tx">
          <span class="place">${p}</span>
          <h3>${t}</h3>
          <p class="spec"><b>Материалы:</b> ${m}</p>
        </div>
      </article>`).join('');
    reveal();
  }
  if (fbox) fbox.onclick = e => {
    const b = e.target.closest('.fl'); if (!b) return;
    active = b.dataset.t;
    fbox.querySelectorAll('.fl').forEach(x => x.classList.toggle('on', x === b));
    draw();
  };
  draw();
}

function reveal(){
  if (reduced || !('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.style.transitionDelay = (e.target.dataset.d || 0) + 's';
    e.target.classList.add('in'); io.unobserve(e.target);
  }), {rootMargin:'0px 0px -6% 0px', threshold:.04});
  host.querySelectorAll('section > .wrap > *').forEach(el => {
    if (el.closest('.hero') || el.classList.contains('rv')) return;
    el.classList.add('rv'); io.observe(el);
  });
  host.querySelectorAll('.cell,.obj,.step,.tenets li,.duo').forEach((el,i) => {
    if (el.classList.contains('rv')) return;
    el.classList.add('rv'); el.dataset.d = Math.min((i % 6) * .08, .4); io.observe(el);
  });
  setTimeout(() => host.querySelectorAll('.rv:not(.in)').forEach(el => {
    if (el.getBoundingClientRect().top < innerHeight) el.classList.add('in');
  }), 40);
}

function parallax(){
  if (reduced) return;
  const img = host.querySelector('.hero-ph img');
  if (!img) return;
  const box = img.parentElement;
  let raf = null;
  function frame(){
    raf = null;
    const r = box.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) return;
    // не больше 28 пикселей за весь проход экрана: это глубина, а не эффект
    const p = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
    img.style.transform = 'scale(1.05) translate3d(0,' + (p * 28).toFixed(1) + 'px,0)';
  }
  const onScroll = () => { if (raf === null) raf = requestAnimationFrame(frame); };
  if (!parallax.bound) {
    // экраны переключаются без перезагрузки, поэтому подписываемся один раз,
    // а кадр берём заново при каждом показе
    addEventListener('scroll', () => { if (parallax.frame) parallax.frame(); }, {passive: true});
    addEventListener('resize', () => { if (parallax.frame) parallax.frame(); }, {passive: true});
    parallax.bound = true;
  }
  parallax.frame = onScroll;
  frame();
}

function turn(){
  const box = host.querySelector('#turn');
  if (!box) return;
  const states = [...box.querySelectorAll('.turn-state')];
  const word = box.querySelector('#turnword');
  const dots = box.querySelector('#turndots');
  if (!states.length || !dots) return;

  let cur = 0, timer = null;
  dots.innerHTML = states.map((_, i) =>
    `<button type="button" aria-label="Кадр ${i + 1}" aria-current="${i === 0}"></button>`).join('');
  const btns = [...dots.querySelectorAll('button')];

  function show(n){
    cur = (n + states.length) % states.length;
    states.forEach((st, i) => st.classList.toggle('on', i === cur));
    btns.forEach((b, i) => b.setAttribute('aria-current', String(i === cur)));
    word.innerHTML = states[cur].dataset.word || '';
    word.animate([{opacity:0, transform:'translateX(-50%) translateY(8px)'},
                  {opacity:1, transform:'translateX(-50%) translateY(0)'}],
                 {duration:420, easing:'cubic-bezier(.2,.7,.25,1)'});
  }
  function play(){ stop(); if (!reduced) timer = setInterval(() => show(cur + 1), 6000); }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }

  btns.forEach((b, i) => b.onclick = () => { show(i); play(); });
  box.addEventListener('mouseenter', stop);
  box.addEventListener('mouseleave', play);
  play();
}

function pins(){
  host.querySelectorAll('.pin').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      const open = btn.classList.contains('on');
      host.querySelectorAll('.pin.on').forEach(x => x.classList.remove('on'));
      const note = host.querySelector('#pinnote');
      if (open) {
        if (note) note.textContent = '';
      } else {
        btn.classList.add('on');
        if (note) note.textContent = btn.querySelector('span')?.textContent || '';
      }
    };
  });
  if (!pins.bound) {
    document.addEventListener('click', () => {
      document.querySelectorAll('.pin.on').forEach(x => x.classList.remove('on'));
      const n = document.querySelector('#pinnote');
      if (n) n.textContent = '';
    });
    pins.bound = true;
  }
}

function selects(){
  host.querySelectorAll('.form select').forEach(sel => {
    if (sel.parentElement.classList.contains('sel')) return;
    const wrap = document.createElement('div');
    wrap.className = 'sel';
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sel-btn';
    btn.setAttribute('aria-haspopup', 'listbox');
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = sel.options[sel.selectedIndex].text;
    wrap.appendChild(btn);

    const list = document.createElement('div');
    list.className = 'sel-list';
    list.setAttribute('role', 'listbox');
    [...sel.options].forEach((o, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'option');
      b.setAttribute('aria-selected', String(i === sel.selectedIndex));
      b.textContent = o.text;
      b.onclick = () => {
        sel.selectedIndex = i;
        btn.textContent = o.text;
        list.querySelectorAll('button').forEach((x, xi) =>
          x.setAttribute('aria-selected', String(xi === i)));
        wrap.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      };
      list.appendChild(b);
    });
    wrap.appendChild(list);

    btn.onclick = e => {
      e.stopPropagation();
      const open = wrap.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    };
    btn.onkeydown = e => {
      if (e.key === 'Escape') { wrap.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
      if (e.key === 'ArrowDown') { e.preventDefault(); wrap.classList.add('open'); }
    };
  });

  if (!selects.bound) {
    document.addEventListener('click', () => {
      document.querySelectorAll('.sel.open').forEach(o => {
        o.classList.remove('open');
        o.querySelector('.sel-btn')?.setAttribute('aria-expanded', 'false');
      });
    });
    addEventListener('keydown', e => {
      if (e.key === 'Escape')
        document.querySelectorAll('.sel.open').forEach(o => {
          o.classList.remove('open');
          o.querySelector('.sel-btn')?.setAttribute('aria-expanded', 'false');
        });
    });
    selects.bound = true;
  }
}

function show(name){
  host.innerHTML = SCREENS[name];
  document.querySelectorAll('.tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.s === name)));
  if (name === 'home') renderObjects('objgrid','filters',6);
  if (name === 'obj') renderObjects('objgrid2','filters2');
  scrollTo({top:0});
  reveal();
  parallax();
  selects();
  pins();
  turn();
}

document.querySelector('.tabs').onclick = e => {
  const t = e.target.closest('.tab'); if (t) show(t.dataset.s);
};
document.getElementById('notes').onchange = e =>
  document.body.classList.toggle('notes', e.target.checked);

const lb = document.getElementById('lb');
document.body.addEventListener('click', e => {
  const open = e.target.closest('[data-open]');
  if (open){ e.preventDefault(); show(open.dataset.open); return; }
  const p = e.target.closest('[data-lb]');
  if (p){
    lb.querySelector('img').src = p.dataset.lb;
    lb.querySelector('.cap').textContent = p.dataset.cap || '';
    lb.classList.add('on');
  }
});
lb.onclick = () => lb.classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('on'); });

show('home');
</script>
</html>
